name: Backend CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sewflow
          POSTGRES_PASSWORD: sewflow
          POSTGRES_DB: sewflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sewflow -d sewflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sewflow:sewflow@localhost:5432/sewflow_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      JWT_EXPIRES_IN: 15m
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace backend

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma

      - name: Typecheck backend
        run: npm run typecheck --workspace backend

      - name: Run tests with coverage gate
        run: >-
          npm run build --workspace backend &&
          node --test --experimental-test-coverage
          --test-coverage-lines=80
          backend/dist/__tests__/*.test.js